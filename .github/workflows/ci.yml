name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit tests (Pi extension, Claude command, core)
        run: npm test
      - name: Claude Code plugin tests
        # Pinned: the plugin hook API is new; bump this to test against a newer Claude Code.
        run: npx -y @anthropic-ai/claude-code@2.1.289 plugin test .

name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read
  # npm trusted publishing: the job proves it runs here with a GitHub OIDC token instead of an npm token.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Check the tag matches package.json
        run: test "${GITHUB_REF_NAME}" = "v$(node -p 'require("./package.json").version')"
      # prepublishOnly runs typecheck, lint and the tests before the package is built and sent.
      - run: npm publish
